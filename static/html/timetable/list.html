<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课表中心 - 教务管理系统</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <div class="page-wrap">
    <div class="page-header">
      <div>
        <h2 class="page-title">课表中心</h2>
        <div class="page-subtitle">按班级查看每周课程安排</div>
      </div>
      <span class="badge-soft green" id="summary">-</span>
    </div>

    <div class="panel">
      <div class="panel-toolbar">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-sm-auto">
            <label class="form-label mb-1">班级</label>
            <select class="form-select form-select-sm" id="classSelect"><option value="">请选择班级</option></select>
          </div>
        </div>
      </div>

      <div class="table-responsive panel-table">
        <table class="table table-bordered timetable-table mb-0">
          <thead>
            <tr>
              <th>周一</th><th>周二</th><th>周三</th><th>周四</th><th>周五</th><th>周六</th><th>周日</th>
            </tr>
          </thead>
          <tbody id="timetableBody">
            <tr><td colspan="7" class="empty-row">请选择班级</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/static/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/timetable.js"></script>
</body>
</html>
