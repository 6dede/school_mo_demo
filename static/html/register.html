<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 教务管理系统</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <i class="bi bi-mortarboard-fill"></i>
        <span>教务管理系统</span>
      </div>
      <p class="login-subtitle">注册新账号</p>

      <form id="registerForm" novalidate>
        <div class="alert alert-danger form-error" id="registerError"></div>

        <div class="mb-3">
          <label class="form-label">用户名</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="username" placeholder="至少 3 个字符" maxlength="50" autocomplete="username" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">昵称（选填）</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
            <input type="text" class="form-control" id="nickname" placeholder="显示名称" maxlength="50" autocomplete="nickname">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">密码</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="至少 6 位" maxlength="64" autocomplete="new-password" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">确认密码</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="form-control" id="confirmPassword" placeholder="请再次输入密码" maxlength="64" autocomplete="new-password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 login-btn" id="registerBtn">
          <i class="bi bi-person-plus me-1"></i>注 册
        </button>
      </form>

      <div class="login-tip">
        已有账号？<a href="/static/html/login.html">返回登录</a>
      </div>
    </div>
  </div>

  <script src="/static/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/register.js"></script>
</body>
</html>
