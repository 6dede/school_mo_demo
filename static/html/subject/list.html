<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学科管理 - 教务管理系统</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <div class="page-wrap">
    <div class="page-header">
      <div>
        <h2 class="page-title">学科管理</h2>
        <div class="page-subtitle">维护开设学科及师资概览</div>
      </div>
      <button type="button" class="btn btn-primary btn-sm" id="addBtn">
        <i class="bi bi-plus-lg me-1"></i>新增学科
      </button>
    </div>

    <div class="panel">
      <div class="panel-toolbar">
        <form class="row g-2 align-items-end search-bar" id="searchForm">
          <div class="col-12 col-sm-auto">
            <label class="form-label mb-1">关键字</label>
            <input type="text" class="form-control form-control-sm" id="keyword" placeholder="按学科名称搜索" autocomplete="off">
          </div>
          <div class="col-12 col-sm-auto">
            <label class="form-label mb-1">每页条数</label>
            <select class="form-select form-select-sm" id="pageSize">
              <option value="10">10 条</option>
              <option value="20">20 条</option>
              <option value="50">50 条</option>
            </select>
          </div>
          <div class="col-12 col-sm-auto">
            <button type="submit" class="btn btn-primary btn-sm">
              <i class="bi bi-search me-1"></i>查询
            </button>
            <button type="button" class="btn btn-light btn-sm ms-2" id="resetBtn">
              <i class="bi bi-arrow-counterclockwise me-1"></i>重置
            </button>
          </div>
        </form>
      </div>

      <div class="table-responsive panel-table">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th style="width: 80px;">ID</th>
              <th>学科名称</th>
              <th style="width: 140px;">任课老师数</th>
              <th style="width: 140px;">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="4" class="empty-row">加载中...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="panel-footer" id="pagination"></div>
    </div>
  </div>

  <!-- 新增 / 编辑弹窗 -->
  <div class="modal fade" id="subjectModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="subjectModalTitle">新增学科</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger form-error" id="subjectFormError"></div>
          <form id="subjectForm" novalidate>
            <input type="hidden" id="subId">
            <label class="form-label required">学科名称</label>
            <input type="text" class="form-control" id="subName" maxlength="50" placeholder="如：语文、数学、英语" required>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary btn-sm" id="saveBtn">
            <i class="bi bi-check2 me-1"></i>保存
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/subject.js"></script>
</body>
</html>
