<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>缴费管理 - 教务管理系统</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <div class="page-wrap">
    <div class="page-header">
      <div>
        <h2 class="page-title">缴费管理</h2>
        <div class="page-subtitle">登记学生费用与缴费状态，首页统计收缴情况</div>
      </div>
      <button type="button" class="btn btn-primary btn-sm" id="addBtn"><i class="bi bi-plus-lg me-1"></i>新增缴费</button>
    </div>

    <div class="panel">
      <div class="panel-toolbar">
        <form class="row g-2 align-items-end search-bar" id="searchForm">
          <div class="col-12 col-sm-auto">
            <label class="form-label mb-1">关键字</label>
            <input type="text" class="form-control form-control-sm" id="keyword" placeholder="学生 / 费用类型" autocomplete="off">
          </div>
          <div class="col-12 col-sm-auto">
            <label class="form-label mb-1">状态</label>
            <select class="form-select form-select-sm" id="statusFilter">
              <option value="">全部状态</option><option value="未缴费">未缴费</option><option value="已缴费">已缴费</option>
            </select>
          </div>
          <div class="col-12 col-sm-auto">
            <label class="form-label mb-1">每页条数</label>
            <select class="form-select form-select-sm" id="pageSize">
              <option value="10">10 条</option><option value="20">20 条</option><option value="50">50 条</option>
            </select>
          </div>
          <div class="col-12 col-sm-auto">
            <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search me-1"></i>查询</button>
            <button type="button" class="btn btn-light btn-sm ms-2" id="resetBtn"><i class="bi bi-arrow-counterclockwise me-1"></i>重置</button>
          </div>
        </form>
      </div>

      <div class="table-responsive panel-table">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th style="width: 70px;">ID</th><th>学生</th><th>班级</th><th>费用类型</th>
              <th style="width: 110px;">金额</th><th style="width: 90px;">状态</th>
              <th style="width: 130px;">缴费日期</th><th style="width: 140px;">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"><tr><td colspan="8" class="empty-row">加载中...</td></tr></tbody>
        </table>
      </div>
      <div class="panel-footer" id="pagination"></div>
    </div>
  </div>

  <div class="modal fade" id="paymentModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="paymentModalTitle">新增缴费</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger form-error" id="paymentFormError"></div>
          <form id="paymentForm" novalidate>
            <input type="hidden" id="paymentId">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label required">学生</label>
                <select class="form-select" id="studentSelect" required></select>
              </div>
              <div class="col-6">
                <label class="form-label required">费用类型</label>
                <input type="text" class="form-control" id="feeType" maxlength="50" placeholder="如：学费" required>
              </div>
              <div class="col-6">
                <label class="form-label required">金额</label>
                <input type="number" class="form-control" id="amount" min="0.01" step="0.01" required>
              </div>
              <div class="col-6">
                <label class="form-label required">状态</label>
                <select class="form-select" id="statusSelect" required>
                  <option value="未缴费">未缴费</option><option value="已缴费">已缴费</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label">缴费日期</label>
                <input type="date" class="form-control" id="payDate">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary btn-sm" id="saveBtn"><i class="bi bi-check2 me-1"></i>保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/payment.js"></script>
</body>
</html>
