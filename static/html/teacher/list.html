<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>老师管理 - 教务管理系统</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <div class="page-wrap">
    <div class="page-header">
      <div>
        <h2 class="page-title">老师管理</h2>
        <div class="page-subtitle">维护教师档案及任教学科</div>
      </div>
      <button type="button" class="btn btn-success btn-sm" id="addBtn">
        <i class="bi bi-plus-lg me-1"></i>新增老师
      </button>
    </div>

    <div class="panel">
      <div class="panel-toolbar">
        <form class="row g-2 align-items-end search-bar" id="searchForm">
          <div class="col-12 col-sm-auto">
            <label class="form-label mb-1">关键字</label>
            <input type="text" class="form-control form-control-sm" id="keyword" placeholder="按姓名搜索" autocomplete="off">
          </div>
          <div class="col-12 col-sm-auto">
            <label class="form-label mb-1">每页条数</label>
            <select class="form-select form-select-sm" id="pageSize">
              <option value="10">10 条</option>
              <option value="20">20 条</option>
              <option value="50">50 条</option>
            </select>
          </div>
          <div class="col-12 col-sm-auto">
            <button type="submit" class="btn btn-primary btn-sm">
              <i class="bi bi-search me-1"></i>查询
            </button>
            <button type="button" class="btn btn-light btn-sm ms-2" id="resetBtn">
              <i class="bi bi-arrow-counterclockwise me-1"></i>重置
            </button>
          </div>
        </form>
      </div>

      <div class="table-responsive panel-table">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th style="width: 70px;">ID</th>
              <th>姓名</th>
              <th style="width: 80px;">性别</th>
              <th style="width: 80px;">年龄</th>
              <th style="width: 100px;">学科</th>
              <th>联系电话</th>
              <th>创建时间</th>
              <th style="width: 140px;">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="8" class="empty-row">加载中...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="panel-footer" id="pagination"></div>
    </div>
  </div>

  <!-- 新增 / 编辑弹窗 -->
  <div class="modal fade" id="teacherModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="teacherModalTitle">新增老师</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger form-error" id="teacherFormError"></div>
          <form id="teacherForm" novalidate>
            <input type="hidden" id="teaId">
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label required">姓名</label>
                <input type="text" class="form-control" id="teaName" maxlength="50" placeholder="请输入姓名" required>
              </div>
              <div class="col-6">
                <label class="form-label required">性别</label>
                <select class="form-select" id="teaGerder" required>
                  <option value="">请选择</option>
                  <option value="男">男</option>
                  <option value="女">女</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label">年龄</label>
                <input type="number" class="form-control" id="teaAge" min="0" max="150" value="30">
              </div>
              <div class="col-6">
                <label class="form-label required">学科</label>
                <select class="form-select" id="teaSubject" required>
                  <option value="">请选择</option>
                  <option value="语文">语文</option>
                  <option value="数学">数学</option>
                  <option value="英语">英语</option>
                  <option value="物理">物理</option>
                  <option value="化学">化学</option>
                  <option value="生物">生物</option>
                  <option value="政治">政治</option>
                  <option value="历史">历史</option>
                  <option value="地理">地理</option>
                  <option value="音乐">音乐</option>
                  <option value="美术">美术</option>
                  <option value="体育">体育</option>
                  <option value="信息技术">信息技术</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label required">联系电话</label>
                <input type="text" class="form-control" id="teaPhone" maxlength="11" placeholder="请输入 9 ~ 11 位联系电话" required>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary btn-sm" id="saveBtn">
            <i class="bi bi-check2 me-1"></i>保存
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/teacher.js"></script>
</body>
</html>
