<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宿舍管理 - 教务管理系统</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <div class="page-wrap">
    <div class="page-header">
      <div>
        <h2 class="page-title">宿舍管理</h2>
        <div class="page-subtitle">按班级维护宿舍床位与入住情况</div>
      </div>
      <button type="button" class="btn btn-primary btn-sm" id="addBtn"><i class="bi bi-plus-lg me-1"></i>新增宿舍</button>
    </div>

    <div class="panel">
      <div class="panel-toolbar">
        <form class="row g-2 align-items-end search-bar" id="searchForm">
          <div class="col-12 col-sm-auto">
            <label class="form-label mb-1">关键字</label>
            <input type="text" class="form-control form-control-sm" id="keyword" placeholder="宿舍楼 / 房间号" autocomplete="off">
          </div>
          <div class="col-12 col-sm-auto">
            <label class="form-label mb-1">班级</label>
            <select class="form-select form-select-sm" id="classFilter"><option value="">全部班级</option></select>
          </div>
          <div class="col-12 col-sm-auto">
            <label class="form-label mb-1">每页条数</label>
            <select class="form-select form-select-sm" id="pageSize">
              <option value="10">10 条</option><option value="20">20 条</option><option value="50">50 条</option>
            </select>
          </div>
          <div class="col-12 col-sm-auto">
            <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search me-1"></i>查询</button>
            <button type="button" class="btn btn-light btn-sm ms-2" id="resetBtn"><i class="bi bi-arrow-counterclockwise me-1"></i>重置</button>
          </div>
        </form>
      </div>

      <div class="table-responsive panel-table">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th style="width: 70px;">ID</th><th>宿舍楼</th><th>房间号</th><th>所属班级</th>
              <th style="width: 90px;">容量</th><th style="width: 90px;">已入住</th>
              <th style="width: 90px;">空余</th><th style="width: 140px;">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"><tr><td colspan="8" class="empty-row">加载中...</td></tr></tbody>
        </table>
      </div>
      <div class="panel-footer" id="pagination"></div>
    </div>
  </div>

  <div class="modal fade" id="dormModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="dormModalTitle">新增宿舍</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger form-error" id="dormFormError"></div>
          <form id="dormForm" novalidate>
            <input type="hidden" id="dormId">
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label required">宿舍楼</label>
                <input type="text" class="form-control" id="building" maxlength="50" placeholder="如：1号楼" required>
              </div>
              <div class="col-6">
                <label class="form-label required">房间号</label>
                <input type="text" class="form-control" id="room" maxlength="20" placeholder="如：302" required>
              </div>
              <div class="col-6">
                <label class="form-label required">床位容量</label>
                <input type="number" class="form-control" id="capacity" min="1" value="4" required>
              </div>
              <div class="col-6">
                <label class="form-label required">已入住</label>
                <input type="number" class="form-control" id="occupied" min="0" value="0" required>
              </div>
              <div class="col-12">
                <label class="form-label required">所属班级</label>
                <select class="form-select" id="classSelect" required></select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary btn-sm" id="saveBtn"><i class="bi bi-check2 me-1"></i>保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/dormitory.js"></script>
</body>
</html>
